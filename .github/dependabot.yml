version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /sdk/node
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /sdk/rust
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
