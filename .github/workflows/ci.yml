name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "./sdk/python[dev]"

      - name: Lint maintained Python SDK
        run: python -m ruff check .

      - name: Run Python tests
        run: >
          python -m pytest -q
          tests/cert
          tests/integration
          tests/test_acp_json_media_type.py
          tests/test_batch_message.py
          tests/test_message_ack.py
          tests/test_messages_stream.py
          tests/test_v15_hybrid_identity.py
          sdk/python/tests

      - name: Build Python distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          (cd sdk/python && python -m build)

  node:
    name: Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Node SDK
        working-directory: sdk/node
        run: |
          npm test
          npm run lint

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdk/go/go.mod

      - name: Test Go SDK
        working-directory: sdk/go
        run: go test ./...

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Rust SDK
        working-directory: sdk/rust
        run: cargo test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material pymdown-extensions
          mkdocs build --strict
